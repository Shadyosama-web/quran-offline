
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075e46">
  <title>القرآن الكريم</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5ed;
      color: #183b30;
      text-align: center;
    }
    header {
      background: #075e46;
      color: white;
      padding: 25px 12px;
    }
    h1 { margin: 0 0 10px; }
    main { padding: 20px 14px; }
    select, button {
      font-size: 17px;
      padding: 12px;
      margin: 8px;
      border-radius: 8px;
    }
    select { max-width: 95%; }
    button {
      background: #075e46;
      color: white;
      border: 0;
    }
    #quran {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      font-size: 25px;
      line-height: 2.2;
      text-align: right;
    }
    .note { font-size: 14px; color: #666; }
  </style>
</head>
<body>
  <header>
    <h1>القرآن الكريم</h1>
    <p>اقرأ القرآن الكريم أينما كنت</p>
  </header>
  <main>
    <h3>اختر السورة</h3>
    <select id="surah">
      <option value="1">الفاتحة</option>
      <option value="112">الإخلاص</option>
      <option value="113">الفلق</option>
      <option value="114">الناس</option>
    </select>
    <br>
    <button onclick="loadSurah()">عرض السورة</button>
    <div id="quran">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <p class="note">يلزم الاتصال بالإنترنت لجلب السور في هذه النسخة الأولية.</p>
  </main>
  <script>
    async function loadSurah() {
      const box = document.getElementById('quran');
      box.textContent = 'جاري تحميل السورة...';
      try {
        const n = document.getElementById('surah').value;
        const response = await fetch(
          'https://api.alquran.cloud/v1/surah/' + n
        );
        if (!response.ok) throw new Error();
        const result = await response.json();
        box.textContent = result.data.ayahs.map(
          a => a.text
        ).join(' ۞ ');
      } catch (e) {
        box.textContent = 'تعذر التحميل. تأكد من اتصال الإنترنت.';
      }
    }
  </script>
</body>
</html>
